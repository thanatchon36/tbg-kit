name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Smoke test on synthetic data (build and analyze)
        run: |
          python -m tbg --workspace ci-demo synth
          python -m tbg --workspace ci-demo build
          python -m tbg --workspace ci-demo analyze
